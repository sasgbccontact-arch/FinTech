name: Daily Metals Notification

on:
  schedule:
    # GitHub Actions planifie en UTC et l'exécution réelle peut dériver.
    # On tente donc toutes les 5 min autour de 9h30 Paris:
    #   - été  (CEST, UTC+2) : 07:30 -> 07:55 UTC
    #   - hiver (CET,  UTC+1) : 08:30 -> 08:55 UTC
    # Le script filtre ensuite sur l'heure de Paris et n'envoie qu'une fois par jour.
    - cron: "30-55/5 7 * * *"
    - cron: "30-55/5 8 * * *"
  workflow_dispatch: {}   # Déclenchement manuel (tests)

jobs:
  send-metals-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Send metals notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # "manual" quand déclenché via workflow_dispatch → ignore la fenêtre horaire
          TRIGGER: ${{ github.event_name }}
        run: node scripts/send_metals_notification.js
