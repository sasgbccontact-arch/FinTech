name: Daily Metals Notification

on:
  schedule:
    # GitHub Actions peut dériver de plusieurs minutes. On lance donc
    # le worker toutes les 10 min entre 07:00 et 10:50 UTC et le script
    # filtre ensuite sur l'heure de Paris.
    - cron: "*/10 7-10 * * *"
  workflow_dispatch: {}   # Déclenchement manuel (tests)

jobs:
  send-metals-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Send metals notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # "manual" quand déclenché via workflow_dispatch → ignore la fenêtre horaire
          TRIGGER: ${{ github.event_name }}
        run: node scripts/send_metals_notification.js
