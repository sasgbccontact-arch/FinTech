name: Process Weekly Duels

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      duel_id:
        description: "ID du duel à traiter manuellement"
        required: false
        type: string
      force_end:
        description: "Forcer la fin immédiate du duel ciblé"
        required: false
        default: false
        type: boolean

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Run duel worker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          MANUAL_DUEL_ID: ${{ inputs.duel_id }}
          MANUAL_FORCE_END: ${{ inputs.force_end }}
        run: |
          if [ -n "$MANUAL_DUEL_ID" ]; then
            if [ "$MANUAL_FORCE_END" = "true" ]; then
              node scripts/process_duels.js --duel-id "$MANUAL_DUEL_ID" --force-end
            else
              node scripts/process_duels.js --duel-id "$MANUAL_DUEL_ID"
            fi
          else
            npm run settle
          fi
